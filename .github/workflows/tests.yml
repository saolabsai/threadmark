name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m black --check src tests examples
      - run: python -m threadmark setup-tokenizer
      - run: python -m pytest -q
      - run: python -m threadmark demo
      - run: python -m threadmark inspect --input examples/workflow.json
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m build
